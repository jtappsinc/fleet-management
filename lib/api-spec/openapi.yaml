components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthUser:
      type: object
      required: [id, email, fullName, role, department, departmentId]
      properties:
        id: { type: integer }
        email: { type: string }
        fullName: { type: string }
        role: { type: string }
        department: { type: string }
        departmentId: { type: integer }
    AuthMeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }

    DashboardKpi:
      type: object
      required: [openJobs, scheduledJobs, completedThisMonth, pipelineCents, paidThisMonthCents, outstandingInvoicesCents, fleetActive, fleetInShop, employees]
      properties:
        openJobs: { type: integer }
        scheduledJobs: { type: integer }
        completedThisMonth: { type: integer }
        pipelineCents: { type: integer }
        paidThisMonthCents: { type: integer }
        outstandingInvoicesCents: { type: integer }
        fleetActive: { type: integer }
        fleetInShop: { type: integer }
        employees: { type: integer }
    DashboardJobByStatus:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    DashboardRecentJob:
